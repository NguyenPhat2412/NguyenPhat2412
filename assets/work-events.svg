<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300"><title>03 / EVENT-DRIVEN SYSTEMS</title><style>@keyframes lift{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes flow{to{stroke-dashoffset:-80}}@keyframes reveal{0%{stroke-dashoffset:700}60%,100%{stroke-dashoffset:0}}@keyframes radar{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}.lift{animation:lift 5s ease-in-out infinite}.pulse{animation:pulse 3s ease-in-out infinite}.flow{stroke-dasharray:7 13;animation:flow 4s linear infinite}.chart{stroke-dasharray:700;animation:reveal 5s ease-in-out infinite}.radar{transform-origin:280px 108px;animation:radar 9s linear infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="1" y="1" width="558" height="298" rx="18" fill="#101923" stroke="#29394a"/><path d="M25 190H535" stroke="#29394a"/><g fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="48" y="77" width="125" height="58" rx="10" stroke="#c4a5ff"/><text x="68" y="112">PRODUCER</text><circle cx="277" cy="106" r="36" stroke="#c4a5ff" stroke-width="2"/><text x="253" y="112">EVENT</text><rect x="399" y="40" width="116" height="42" rx="8" stroke="#c4a5ff"/><rect x="399" y="121" width="116" height="42" rx="8" stroke="#c4a5ff"/><text x="415" y="66">SERVICE A</text><text x="415" y="147">SERVICE B</text><path class="flow" d="M173 106H241M313 106H355V61H399M355 106V142H399" stroke="#c4a5ff" stroke-width="3"/><circle class="pulse" cx="277" cy="106" r="46" stroke="#c4a5ff" opacity=".3"/></g><style>text{fill:#c4a5ff;font:13px Arial,sans-serif}</style><text x="26" y="225" style="font:bold 19px Arial,sans-serif;fill:#c4a5ff">03 / EVENT-DRIVEN SYSTEMS</text><text x="26" y="261" style="font:17px Arial,sans-serif;fill:#a8b8ca">Decoupled services. Connected data.</text></svg>