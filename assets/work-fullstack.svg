<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300"><title>01 / FULL-STACK PLATFORMS</title><style>@keyframes lift{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes flow{to{stroke-dashoffset:-80}}@keyframes reveal{0%{stroke-dashoffset:700}60%,100%{stroke-dashoffset:0}}@keyframes radar{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}.lift{animation:lift 5s ease-in-out infinite}.pulse{animation:pulse 3s ease-in-out infinite}.flow{stroke-dasharray:7 13;animation:flow 4s linear infinite}.chart{stroke-dasharray:700;animation:reveal 5s ease-in-out infinite}.radar{transform-origin:280px 108px;animation:radar 9s linear infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="1" y="1" width="558" height="298" rx="18" fill="#101923" stroke="#29394a"/><path d="M25 190H535" stroke="#29394a"/><g fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="66" y="51" width="130" height="104" rx="9" stroke="#7ee7c1" stroke-width="2"/><path d="M66 75H196" stroke="#7ee7c1"/><circle cx="79" cy="64" r="3" fill="#7ee7c1"/><circle cx="91" cy="64" r="3" fill="#7ee7c1"/><path d="M89 99L79 109L89 119M168 99L178 109L168 119M137 93L121 124" stroke="#7ee7c1" stroke-width="3"/><rect x="282" y="48" width="190" height="40" rx="8" stroke="#7ee7c1"/><rect x="282" y="115" width="190" height="40" rx="8" stroke="#7ee7c1"/><text x="314" y="74">API / SERVICES</text><text x="324" y="141">DATABASE</text><path class="flow" d="M196 103H238V68H282M377 88V115" stroke="#7ee7c1" stroke-width="3"/><circle class="pulse" cx="455" cy="68" r="4" fill="#7ee7c1"/></g><style>text{fill:#7ee7c1;font:13px Arial,sans-serif}</style><text x="26" y="225" style="font:bold 19px Arial,sans-serif;fill:#7ee7c1">01 / FULL-STACK PLATFORMS</text><text x="26" y="261" style="font:17px Arial,sans-serif;fill:#a8b8ca">From interface to infrastructure.</text></svg>