<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300"><title>04 / DATA &amp; ANALYTICS</title><style>@keyframes lift{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes flow{to{stroke-dashoffset:-80}}@keyframes reveal{0%{stroke-dashoffset:700}60%,100%{stroke-dashoffset:0}}@keyframes radar{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}.lift{animation:lift 5s ease-in-out infinite}.pulse{animation:pulse 3s ease-in-out infinite}.flow{stroke-dasharray:7 13;animation:flow 4s linear infinite}.chart{stroke-dasharray:700;animation:reveal 5s ease-in-out infinite}.radar{transform-origin:280px 108px;animation:radar 9s linear infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="1" y="1" width="558" height="298" rx="18" fill="#101923" stroke="#29394a"/><path d="M25 190H535" stroke="#29394a"/><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M75 44V158H489" stroke="#405166"/><path d="M75 84H489M75 121H489" stroke="#29394a" stroke-dasharray="3 6"/><path class="chart" d="M80 141L132 124L179 132L225 94L274 105L325 65L379 81L429 49L480 57" stroke="#ffc67d" stroke-width="3"/><circle class="pulse" cx="429" cy="49" r="6" fill="#ffc67d"/><rect x="106" y="104" width="16" height="53" rx="3" fill="#ffc67d" opacity=".13"/><rect x="205" y="78" width="16" height="79" rx="3" fill="#ffc67d" opacity=".13"/><rect x="308" y="49" width="16" height="108" rx="3" fill="#ffc67d" opacity=".13"/><rect x="411" y="35" width="16" height="122" rx="3" fill="#ffc67d" opacity=".13"/></g><style>text{fill:#ffc67d;font:13px Arial,sans-serif}</style><text x="26" y="225" style="font:bold 19px Arial,sans-serif;fill:#ffc67d">04 / DATA &amp; ANALYTICS</text><text x="26" y="261" style="font:17px Arial,sans-serif;fill:#a8b8ca">Turn observations into understanding.</text></svg>