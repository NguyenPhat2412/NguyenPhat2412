      <g transform="translate(24, 196)"><path d="M8 1.5L9.95 5.45L14.3 6.08L11.15 9.15L11.89 13.48L8 11.43L4.11 13.48L4.85 9.15L1.7 6.08L6.05 5.45L8 1.5Z" stroke="#e0af68" stroke-width="1.45" fill="none" stroke-linejoin="round" /></g>
      <text x="47" y="208" fill="#c8d3f5" font-size="12.2" font-weight="600">Stars Earned</text>
      <text x="312" y="208" text-anchor="end" fill="#ffffff" font-size="13.2" font-weight="700" class="mono">38</text>
    </g>
    <g class="fade-row" style="animation-delay: 0.43s">
      <g transform="translate(24, 227)"><rect x="2.2" y="1.8" width="11.6" height="12.4" rx="2" stroke="#9ece6a" stroke-width="1.5" fill="none" /><line x1="5.2" y1="1.8" x2="5.2" y2="14.2" stroke="#9ece6a" stroke-width="1.3" /><line x1="7.5" y1="5.2" x2="11.5" y2="5.2" stroke="#9ece6a" stroke-width="1.4" stroke-linecap="round" /></g>
      <text x="47" y="239" fill="#c8d3f5" font-size="12.2" font-weight="600">Total Repositories<tspan dx="5" fill="#6b749e" font-size="10">(All)</tspan></text>
