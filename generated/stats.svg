    <text x="34" y="287" fill="#bb9af7" font-size="10.8" font-weight="700">🔒 Private: 2,200 (77.2%)</text>
    <text x="461" y="287" text-anchor="end" fill="#38bdae" font-size="10.8" font-weight="700">🌐 Public: 651 (22.8%)</text>
    <g clip-path="url(#statsCommitBarClip)">
