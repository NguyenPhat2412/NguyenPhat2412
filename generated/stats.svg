<svg xmlns="http://www.w3.org/2000/svg" width="495" height="340" viewBox="0 0 495 340" fill="none" role="img" aria-labelledby="statsCardTitle statsCardDesc">
  <title id="statsCardTitle">Nguyễn Xuân Phát (@NguyenPhat2412) — GitHub Stats &amp; Rank</title>
  <desc id="statsCardDesc">Total Commits: 2,851 (Public + Private), Rank: A (Top 15.2%).</desc>

  <defs>
    <clipPath id="statsOuterClip">
      <rect x="0" y="0" width="495" height="340" rx="16" />
