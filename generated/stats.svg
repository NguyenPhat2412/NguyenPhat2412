      <text x="47" y="146" fill="#c8d3f5" font-size="12.2" font-weight="600">Pull Requests</text>
      <text x="312" y="146" text-anchor="end" fill="#ffffff" font-size="13.2" font-weight="700" class="mono">466</text>
