    </filter>
  </defs>

  <style>
    .sans {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    @keyframes fadeInRow {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes ringSweep {
      from { stroke-dashoffset: 326.73; }
      to { stroke-dashoffset: 49.52; }
    }
    .fade-row {
      animation: fadeInRow 0.5s ease-out backwards;
    }
    .ring-arc {
      stroke-dasharray: 326.73;
      stroke-dashoffset: 49.52;
      animation: ringSweep 1.25s cubic-bezier(0.22, 1, 0.36, 1) backwards;
      filter: drop-shadow(0 0 6px #38bdae);
    }
    @media (prefers-reduced-motion: reduce) {
      .fade-row, .ring-arc { animation: none !important; }
    }
  </style>

