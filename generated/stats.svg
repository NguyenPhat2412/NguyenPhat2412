    <pattern id="statsGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(122, 162, 247, 0.06)" stroke-width="1" />
    </pattern>
    <filter id="statsBlur" x="-50%" y="-50%" width="200%" height="200%">
