      <text x="47" y="115" fill="#c8d3f5" font-size="12.2" font-weight="600">Commits This Year<tspan dx="5" fill="#6b749e" font-size="10">(2026)</tspan></text>
      <text x="312" y="115" text-anchor="end" fill="#ffffff" font-size="13.2" font-weight="700" class="mono">2,535</text>
