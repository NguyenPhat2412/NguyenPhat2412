      <text x="47" y="177" fill="#c8d3f5" font-size="12.2" font-weight="600">Reviews &amp; Issues</text>
      <text x="312" y="177" text-anchor="end" fill="#ffffff" font-size="13.2" font-weight="700" class="mono">2 / 114</text>
